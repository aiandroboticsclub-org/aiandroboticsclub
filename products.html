<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - AI & Robotics Club</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="header.js" defer></script>
  <script src="prefooter.js" defer></script>
  <script src="footer.js" defer></script>

  <style>
    .products-page {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: Arial, sans-serif;
    }

    .page-title {
      text-align: center;
      margin-bottom: 0.5rem;
      color: #111;
    }

    .page-subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 2rem;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 250px;
      padding: 0.75rem 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    .search-input:focus {
      border-color: #25D366;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    }

    .product-image-wrap {
      width: 100%;
      height: 220px;
      background-color: #f8fafc;
      overflow: hidden;
    }

    .product-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-details {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #1e293b;
      margin: 0 0 0.5rem 0;
    }

    .product-price {
      font-size: 1.25rem;
      font-weight: bold;
      color: #0f172a;
      margin-bottom: 0.75rem;
    }

    .product-description {
      font-size: 0.9rem;
      color: #64748b;
      line-height: 1.4;
      margin-bottom: 1.25rem;
      flex-grow: 1;
    }

    .btn-add-cart {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: #0f172a;
      color: #ffffff;
      border: none;
      font-weight: bold;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-add-cart:hover {
      background-color: #1e293b;
    }

    .cart-floating-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background-color: #0f172a;
      color: #ffffff;
      border: none;
      border-radius: 50px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      z-index: 998;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s ease;
    }

    .cart-floating-btn:hover {
      transform: scale(1.05);
    }

    .cart-badge {
      background-color: #25D366;
      color: #ffffff;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .cart-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      z-index: 999;
    }

    .cart-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .cart-drawer {
      position: fixed;
      top: 0;
      right: -420px;
      width: 380px;
      max-width: 90vw;
      height: 100vh;
      background: #ffffff;
      box-shadow: -4px 0 20px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      font-family: Arial, sans-serif;
    }

    .cart-drawer.open {
      right: 0;
    }

    .cart-header {
      padding: 18px 20px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
    }

    .cart-header h2 {
      margin: 0;
      font-size: 1.2rem;
      color: #0f172a;
    }

    .cart-close-btn {
      background: none;
      border: none;
      font-size: 1.8rem;
      line-height: 1;
      cursor: pointer;
      color: #64748b;
    }

    .cart-items-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    .cart-item img {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border-radius: 6px;
      background: #f1f5f9;
    }

    .cart-item-details {
      flex: 1;
    }

    .cart-item-title {
      font-weight: bold;
      font-size: 0.95rem;
      color: #0f172a;
      margin: 0 0 4px 0;
    }

    .cart-item-price {
      color: #475569;
      font-size: 0.85rem;
      margin: 0;
    }

    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }

    .qty-btn {
      background: #e2e8f0;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      line-height: 1;
    }

    .qty-number {
      font-size: 0.85rem;
      font-weight: bold;
      min-width: 18px;
      text-align: center;
    }

    .remove-item-btn {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 0.8rem;
      cursor: pointer;
      margin-left: auto;
    }

    .cart-footer {
      padding: 16px 20px;
      border-top: 1px solid #e2e8f0;
      background: #f8fafc;
    }

    .cart-summary {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      color: #0f172a;
      margin-bottom: 12px;
    }

    .cart-checkout-btn {
      width: 100%;
      background-color: #25D366;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s ease;
    }

    .cart-checkout-btn:hover {
      background-color: #1da851;
    }

    .empty-cart-msg {
      text-align: center;
      color: #64748b;
      margin-top: 40px;
      font-size: 0.95rem;
    }

    .no-products {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: #64748b;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div id="site-header"></div>

  <main class="products-page">
    <h1 class="page-title">AI & Robotics Store</h1>
    <p class="page-subtitle">Add items to your cart and checkout directly via WhatsApp</p>

    <div class="controls-bar">
      <input 
        type="text" 
        id="searchInput" 
        class="search-input" 
        placeholder="Search products by title or description..." 
        oninput="filterProducts()"
      >
    </div>

    <div id="productsGrid" class="products-grid">
      <p style="text-align:center; grid-column: 1/-1;">Loading products...</p>
    </div>
  </main>

  <div id="site-prefooter"></div>
  <div id="site-footer"></div>

  <button id="cartToggleBtn" class="cart-floating-btn" onclick="toggleCartDrawer(true)">
    🛒 Cart <span id="cartBadgeCount" class="cart-badge">0</span>
  </button>

  <div id="cartOverlay" class="cart-overlay" onclick="toggleCartDrawer(false)"></div>

  <aside id="cartDrawer" class="cart-drawer">
    <div class="cart-header">
      <h2>Your Shopping Cart</h2>
      <button class="cart-close-btn" onclick="toggleCartDrawer(false)">&times;</button>
    </div>

    <div id="cartItemsContainer" class="cart-items-body">
    </div>

    <div class="cart-footer">
      <div class="cart-summary">
        <span>Subtotal:</span>
        <strong id="cartSubtotalText">Rs. 0</strong>
      </div>

      <div class="form-group" style="margin-top: 10px;">
        <label for="customerName" style="font-size:0.85rem; font-weight:bold; color:#334155; display:block; margin-bottom:4px;">Your Name (Optional)</label>
        <input type="text" id="customerName" placeholder="e.g. Ali Ahmed" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
      </div>

      <button id="whatsappCheckoutBtn" class="cart-checkout-btn" onclick="checkoutViaWhatsApp()">
        📱 Checkout via WhatsApp
      </button>
    </div>
  </aside>

  <script>
    const WHATSAPP_PHONE = '923119696807';
    let allProducts = [];
    let cart = JSON.parse(localStorage.getItem('arc_cart')) || [];

    async function fetchProducts() {
      const grid = document.getElementById('productsGrid');
      try {
        const response = await fetch('products.json');
        if (!response.ok) throw new Error('Failed to load product data');
        allProducts = await response.json();
        renderProducts(allProducts);
      } catch (error) {
        console.error('Error loading products:', error);
        grid.innerHTML = `<div class="no-products">Unable to load products right now. Please check back later!</div>`;
      }
    }

    function renderProducts(products) {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';

      if (products.length === 0) {
        grid.innerHTML = `<div class="no-products">No products found.</div>`;
        return;
      }

      products.forEach(product => {
        const card = document.createElement('article');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="product-image-wrap">
            <img src="${product.image || 'images/placeholder.jpg'}" alt="${product.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x220?text=No+Image'">
          </div>
          <div class="product-details">
            <h2 class="product-title">${product.title}</h2>
            <div class="product-price">${product.price}</div>
            <p class="product-description">${product.description}</p>
            <button class="btn-add-cart" onclick="addToCartById('${product.id}')">
              🛒 Add to Cart
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allProducts.filter(p => 
        p.title.toLowerCase().includes(query) || 
        p.description.toLowerCase().includes(query)
      );
      renderProducts(filtered);
    }

    function toggleCartDrawer(open) {
      const drawer = document.getElementById('cartDrawer');
      const overlay = document.getElementById('cartOverlay');
      if (open) {
        drawer.classList.add('open');
        overlay.classList.add('active');
      } else {
        drawer.classList.remove('open');
        overlay.classList.remove('active');
      }
    }

    function addToCartById(productId) {
      const product = allProducts.find(p => p.id === productId);
      if (!product) return;

      const numericPrice = parseFloat(String(product.price).replace(/[^0-9.]/g, '')) || 0;
      const existingIndex = cart.findIndex(item => item.id === product.id);

      if (existingIndex > -1) {
        cart[existingIndex].quantity += 1;
      } else {
        cart.push({
          id: product.id,
          title: product.title,
          price: product.price,
          numericPrice: numericPrice,
          image: product.image || 'images/placeholder.jpg',
          quantity: 1
        });
      }

      saveAndRenderCart();
      toggleCartDrawer(true);
    }

    function updateQuantity(productId, delta) {
      const item = cart.find(i => i.id === productId);
      if (!item) return;
      item.quantity += delta;
      if (item.quantity <= 0) {
        cart = cart.filter(i => i.id !== productId);
      }
      saveAndRenderCart();
    }

    function removeFromCart(productId) {
      cart = cart.filter(i => i.id !== productId);
      saveAndRenderCart();
    }

    function saveAndRenderCart() {
      localStorage.setItem('arc_cart', JSON.stringify(cart));

      const container = document.getElementById('cartItemsContainer');
      const badge = document.getElementById('cartBadgeCount');
      const subtotalText = document.getElementById('cartSubtotalText');

      const totalItemsCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      badge.textContent = totalItemsCount;

      if (cart.length === 0) {
        container.innerHTML = '<div class="empty-cart-msg">Your shopping cart is empty.</div>';
        subtotalText.textContent = 'Rs. 0';
        return;
      }

      let totalAmount = 0;
      container.innerHTML = '';

      cart.forEach(item => {
        const itemSubtotal = item.numericPrice * item.quantity;
        totalAmount += itemSubtotal;

        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <img src="${item.image}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/55'">
          <div class="cart-item-details">
            <p class="cart-item-title">${item.title}</p>
            <p class="cart-item-price">${item.price}</p>
            <div class="cart-item-controls">
              <button class="qty-btn" onclick="updateQuantity('${item.id}', -1)">-</button>
              <span class="qty-number">${item.quantity}</span>
              <button class="qty-btn" onclick="updateQuantity('${item.id}', 1)">+</button>
              <button class="remove-item-btn" onclick="removeFromCart('${item.id}')">Remove</button>
            </div>
          </div>
        `;
        container.appendChild(div);
      });

      subtotalText.textContent = totalAmount > 0 ? `Rs. ${totalAmount.toLocaleString()}` : 'Calculated in chat';
    }

    function checkoutViaWhatsApp() {
      if (cart.length === 0) {
        alert('Your cart is empty!');
        return;
      }

      const customerName = document.getElementById('customerName').value.trim();
      
      let message = `🛒 *NEW ORDER - AI & Robotics Club*\\n`;
      if (customerName) {
        message += `👤 *Customer:* ${customerName}\\n`;
      }
      message += `-----------------------------------\\n\\n`;

      let grandTotal = 0;

      cart.forEach((item, index) => {
        const itemTotal = item.numericPrice * item.quantity;
        grandTotal += itemTotal;
        
        message += `${index + 1}. *${item.title}*\\n`;
        message += `   • Quantity: ${item.quantity}\\n`;
        message += `   • Price: ${item.price}\\n\\n`;
      });

      message += `-----------------------------------\\n`;
      if (grandTotal > 0) {
        message += `💰 *Estimated Total:* Rs. ${grandTotal.toLocaleString()}\\n\\n`;
      }
      message += `Please confirm item availability and shipping details. Thank you!`;

      const encodedMessage = encodeURIComponent(message);
      const whatsappUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${encodedMessage}`;

      window.open(whatsappUrl, '_blank');
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchProducts();
      saveAndRenderCart();
    });
  </script>
</body>
</html>
