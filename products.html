<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - AI & Robotics Club</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Shared Header and Footer Scripts -->
  <script src="header.js" defer></script>
  <script src="footer.js" defer></script>

  <style>
    /* Base Page Styling */
    .products-page {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: Arial, sans-serif;
    }

    .page-title {
      text-align: center;
      margin-bottom: 0.5rem;
      color: #111;
    }

    .page-subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 2rem;
    }

    /* Search & Filter Controls */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 250px;
      padding: 0.75rem 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    .search-input:focus {
      border-color: #25D366;
    }

    /* Product Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    /* Product Card */
    .product-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    }

    .product-image-wrap {
      width: 100%;
      height: 220px;
      background-color: #f8fafc;
      overflow: hidden;
    }

    .product-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-details {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #1e293b;
      margin: 0 0 0.5rem 0;
    }

    .product-price {
      font-size: 1.25rem;
      font-weight: bold;
      color: #0f172a;
      margin-bottom: 0.75rem;
    }

    .product-description {
      font-size: 0.9rem;
      color: #64748b;
      line-height: 1.4;
      margin-bottom: 1.25rem;
      flex-grow: 1;
    }

    /* WhatsApp Order Button */
    .whatsapp-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: #25D366;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      text-align: center;
      transition: background-color 0.2s ease;
    }

    .whatsapp-btn:hover {
      background-color: #1da851;
    }

    .whatsapp-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Empty state */
    .no-products {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: #64748b;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- Dynamic Header injected by header.js -->
  <div id="site-header"></div>

  <main class="products-page">
    <h1 class="page-title">AI & Robotics Store</h1>
    <p class="page-subtitle">Select an item below to order directly via WhatsApp</p>

    <!-- Search Bar -->
    <div class="controls-bar">
      <input 
        type="text" 
        id="searchInput" 
        class="search-input" 
        placeholder="Search products by title or description..." 
        oninput="filterProducts()"
      >
    </div>

    <!-- Container where products render dynamically -->
    <div id="productsGrid" class="products-grid">
      <p style="text-align:center; grid-column: 1/-1;">Loading products...</p>
    </div>
  </main>

  <!-- Dynamic Footer injected by footer.js -->
  <div id="site-footer"></div>

  <script>
    // Configuration
    const WHATSAPP_PHONE = '923000000000'; // Replace with your phone number (including country code, no '+' or spaces)
    let allProducts = [];

    // Fetch and Load Products from JSON
    async function fetchProducts() {
      const grid = document.getElementById('productsGrid');
      try {
        const response = await fetch('products.json');
        if (!response.ok) throw new Error('Failed to load product data');
        
        allProducts = await response.json();
        renderProducts(allProducts);
      } catch (error) {
        console.error('Error loading products:', error);
        grid.innerHTML = `<div class="no-products">Unable to load products right now. Please check back later!</div>`;
      }
    }

    // Render Product Cards
    function renderProducts(products) {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';

      if (products.length === 0) {
        grid.innerHTML = `<div class="no-products">No products found.</div>`;
        return;
      }

      products.forEach(product => {
        // Construct custom WhatsApp order message
        const messageText = `Hello! I would like to order from AI & Robotics Club:\n\n` +
                            `*Product:* ${product.title}\n` +
                            `*Price:* ${product.price}\n` +
                            `*ID:* ${product.id}\n\n` +
                            `Please let me know the availability and payment details.`;

        const waUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(messageText)}`;

        const card = document.createElement('article');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="product-image-wrap">
            <img src="${product.image || 'Images/placeholder.jpg'}" alt="${product.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x220?text=No+Image'">
          </div>
          <div class="product-details">
            <h2 class="product-title">${product.title}</h2>
            <div class="product-price">${product.price}</div>
            <p class="product-description">${product.description}</p>
            <a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="whatsapp-btn">
              <svg viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.572-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
              </svg>
              Order via WhatsApp
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Filter products on user search
    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allProducts.filter(p => 
        p.title.toLowerCase().includes(query) || 
        p.description.toLowerCase().includes(query)
      );
      renderProducts(filtered);
    }

    // Initialize on DOM load
    document.addEventListener('DOMContentLoaded', fetchProducts);
  </script>
</body>
</html>
