<!DOCTYPE html>
<html lang="en" class="scroll-smooth h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & Robotics Club | Empowering Future Innovators</title>
    <link rel="icon" type="image/webp" href="images/airlogo.webp">
    <link rel="apple-touch-icon" href="images/airlogo.webp">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            cyan: '#00F0FF',
                            indigo: '#6366F1',
                            purple: '#A855F7',
                            dark: '#060913',
                            card: '#0F172A',
                            cardHover: '#1E293B'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom style.css logic integrated -->
    <style>
        /* Base styles */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #060913;
            color: #F3F4F6;
            overflow-x: hidden;
        }

        /* Glassmorphism panel styling */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-nav {
            background: rgba(6, 9, 19, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Glow effects */
        .glow-cyan {
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
        }

        .glow-purple {
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.25);
        }

        .gradient-text {
            background: linear-gradient(135deg, #00F0FF 0%, #A855F7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gradient-border {
            position: relative;
            border-radius: 1.25rem;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.4), rgba(168, 85, 247, 0.4));
            padding: 1px;
        }

        /* Grid Pattern Background */
        .bg-grid-pattern {
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 32px 32px;
        }
    </style>
</head>
<body class="bg-grid-pattern min-h-screen flex flex-col selection:bg-cyan-500 selection:text-black">

    <!-- Header Navigation -->
    <header class="fixed top-0 left-0 w-full z-50 glass-nav transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <!-- Brand Logo -->
                <a href="index.html" class="flex items-center gap-3 group">
                    <img src="images/airlogo.webp" alt="AI & Robotics Club" class="w-10 h-10 rounded-xl object-contain shadow-lg group-hover:scale-105 transition-transform duration-300">
                    <span class="font-extrabold text-xl tracking-tight text-white">
                        AI & Robotics <span class="text-cyan-400">Club</span>
                    </span>
                </a>

                <!-- Desktop Navigation Links -->
                <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-gray-300">
                    <a href="#hero" class="hover:text-cyan-400 transition-colors">Home</a>
                    <a href="#programs" class="hover:text-cyan-400 transition-colors">Programs</a>
                    <a href="#benefits" class="hover:text-cyan-400 transition-colors">Why Join Us</a>
                    <a href="#contact" class="hover:text-cyan-400 transition-colors">Contact</a>
                </nav>

                <!-- Action CTA Button -->
                <div class="hidden md:flex items-center gap-4">
                    <a href="#contact" class="px-5 py-2.5 rounded-xl font-semibold text-sm text-black bg-cyan-400 hover:bg-cyan-300 transition-all shadow-lg glow-cyan flex items-center gap-2">
                        <i class="fa-solid fa-calendar-check"></i> Free Trial Class
                    </a>
                </div>

                <!-- Mobile Menu Button -->
                <button id="menu-btn" aria-label="Toggle Mobile Menu" class="md:hidden text-gray-300 hover:text-white p-2 rounded-lg focus:outline-none">
                    <i class="fa-solid fa-bars text-2xl"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Navigation Menu Drawer -->
        <div id="mobile-menu" class="hidden md:hidden glass-panel border-t border-gray-800 px-6 pt-4 pb-6 space-y-3">
            <a href="#hero" class="block text-gray-300 hover:text-cyan-400 py-2 transition-colors">Home</a>
            <a href="#programs" class="block text-gray-300 hover:text-cyan-400 py-2 transition-colors">Programs</a>
            <a href="#benefits" class="block text-gray-300 hover:text-cyan-400 py-2 transition-colors">Why Join Us</a>
            <a href="#contact" class="block text-gray-300 hover:text-cyan-400 py-2 transition-colors">Contact</a>
            <a href="#contact" class="block w-full text-center px-5 py-3 rounded-xl font-semibold text-sm text-black bg-cyan-400 hover:bg-cyan-300 transition-all shadow-lg glow-cyan mt-4">
                Book Free Trial Class
            </a>
        </div>
    </header>

    <!-- NOTE: The rest of the original page content (programs already above, benefits, contact, footer, scripts) is being restored from the prepared full file. This call may be size-limited; using push if needed. -->
</body>
</html>
